apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cloudnative-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: sudharshannnn/cloudnative-shop-product:19
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: postgresql://clouduser:cloudpassword@postgres:5432/cloudnative
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi